name: Update arcade stats
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fonttools
      - name: Get font
        run: curl -sL -o PressStart2P-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/pressstart2p/PressStart2P-Regular.ttf
      - name: Build stats image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: AnshX01
        run: python scripts/gen_stats.py
      - name: Commit if changed
        run: |
          rm -f PressStart2P-Regular.ttf
          if [ -n "$(git status --porcelain arcade-stats-live.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add arcade-stats-live.svg
            git commit -m "Update arcade stats"
            git push
          fi
